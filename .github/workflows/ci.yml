name: Verify go-lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: pnpm
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: go vet ./...
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run runner:build
      - run: go test ./server -run TestDockerIntegration -v
        env:
          GO_LAB_DOCKER_TEST: '1'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:ui
